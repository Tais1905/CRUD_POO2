<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Editar Mercadoria</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body onload="carregarMercadoriaParaEditar()">

<header>
  <h1>Editar Mercadoria</h1>
  <nav>
    <a href="listar-mercadorias.html">Voltar</a>
  </nav>
</header>

<main>
  <form onsubmit="atualizarMercadoria(event)">
    <input type="hidden" id="id">

    <label>Nome:</label>
    <input type="text" id="nome" required>

    <label>Descrição:</label>
    <textarea id="descricao" required></textarea>

    <label>Data de validade:</label>
    <input type="date" id="validade" required>

    <label>Fornecedor:</label>
    <select id="fornecedor" required></select>

    <label>Quantidade:</label>
    <input type="number" id="quantidade" required min="0">

    <button type="submit">Atualizar</button>
  </form>
</main>

<script src="../js/mercadorias.js"></script>
</body>
</html>
